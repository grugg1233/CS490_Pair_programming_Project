name: sakila

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: sakila-frontend
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev
  db:
    image: mysql:8.0
    container_name: sakila-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: 
      context: backend
      dockerfile: Dockerfile
    container_name: sakila-backend
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
